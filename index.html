<script>
        async function dispatchCommand() {
            let worker = document.getElementById('targetWorker').value;
            let command = document.getElementById('patronCommand').value;
            let terminal = document.getElementById('terminalOutput');

            if(!command.trim()) {
                alert("Lütfen bir komut veya eğitim notu gir patron!");
                return;
            }

            // 1. AŞAMA: Ekrana yazdır (Senin yaptığın kısım)
            let startLog = `\n[⏳ İŞLENİYOR] Hedef: ${worker.toUpperCase()} | İçerik: "${command}"`;
            terminal.innerText += startLog;
            terminal.scrollTop = terminal.scrollHeight;
            
            // Komut kutusunu temizle
            document.getElementById('patronCommand').value = "";

            try {
                // 2. AŞAMA: Arka plandaki Python API'sine (yerel sunucuya) veriyi gönder
                let response = await fetch("http://127.0.0.1:5000/api/komut-gonder", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        target_worker: worker,
                        patron_emri: command
                    })
                });

                let result = await response.json();

                // 3. AŞAMA: Python'dan gelen cevabı ekrana yaz
                if(response.ok) {
                    let successLog = `\n[✅ BAŞARILI] Sistem Yanıtı: ${result.mesaj}`;
                    terminal.innerText += successLog;
                } else {
                    let errorLog = `\n[❌ HATA] Sistem Yanıtı: ${result.hata}`;
                    terminal.innerText += errorLog;
                }

            } catch (error) {
                let fatalLog = `\n[🚨 BAĞLANTI HATASI] Python motoruna ulaşılamıyor! Yerel sunucu açık mı? Hata: ${error.message}`;
                terminal.innerText += fatalLog;
            }
            
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
