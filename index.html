<!-- index.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UZMCCC - Bot Kontrol Paneli</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .card { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 10px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; }
        button { background-color: #007bff; cursor: pointer; font-weight: bold; margin-top: 20px; border: none; }
        button:hover { background-color: #0056b3; }
        .task-list { background: #2a2a2a; padding: 10px; border-radius: 4px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>UZMCCC YÖNETİM PANELİ</h1>
            <p>Otomatik Sosyal Medya İşçi Sistemi</p>
        </div>

        <div class="card">
            <h3>Yeni Görev Ver</h3>
            <label>Platform Seçin:</label>
            <select id="platform">
                <option value="capcut">CapCut (Video Düzenleme)</option>
                <option value="youtube">YouTube</option>
                <option value="tiktok">TikTok</option>
                <option value="instagram">Instagram</option>
            </select>

            <label>Aksiyon (Komut):</label>
            <input type="text" id="action" placeholder="Örn: generate_vertical_clip" value="generate_vertical_clip">

            <label>Gelişmiş Parametreler (JSON Formatında):</label>
            <input type="text" id="payload" value='{"genre": "arabesk rap", "ratio": "9:16", "watermark": "UZMANÇ", "character_type": "female"}'>

            <button onclick="sendTask()">Görevi Bota İlet</button>
        </div>

        <div class="card">
            <h3>Bekleyen Görevler (Hafıza)</h3>
            <div id="pendingTasks" class="task-list">Yükleniyor...</div>
        </div>
    </div>

    <script>
        function fetchTasks() {
            fetch('/api/tasks')
                .then(response => response.json())
                .then(data => {
                    const pendingDiv = document.getElementById('pendingTasks');
                    if(data.pending.length === 0) {
                        pendingDiv.innerHTML = "Şu an bekleyen görev yok. Bot dinleniyor.";
                    } else {
                        pendingDiv.innerHTML = data.pending.map(t => `<p>⏳ [${t.platform.toUpperCase()}] -> ${t.action}</p>`).join('');
                    }
                });
        }

        function sendTask() {
            const platform = document.getElementById('platform').value;
            const action = document.getElementById('action').value;
            let payload = {};
            try {
                payload = JSON.parse(document.getElementById('payload').value);
            } catch (e) {
                alert("Parametreler geçerli bir JSON formatında değil!");
                return;
            }

            fetch('/api/add_task', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ platform, action, payload })
            }).then(() => {
                alert("Görev başarıyla eklendi!");
                fetchTasks();
            });
        }

        // Sayfa açıldığında ve her 5 saniyede bir görevleri güncelle
        fetchTasks();
        setInterval(fetchTasks, 5000);
    </script>
</body>
</html>
