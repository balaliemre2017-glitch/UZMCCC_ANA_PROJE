name: UZMCCC Bot Otomasyonu

on:
  push:
    branches:
      - main
  schedule:
    # Her gün sabah 09:00'da (UTC) otomatik çalıştır (Zamanı kendine göre ayarlayabilirsin)
    - cron: '0 9 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Github'dan Çek (Checkout Repository)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle (Requirements)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: UZMCCC Sistemini Başlat (Run Main)
        run: python main.py
        env:
          # Eğer ileride API anahtarları eklersen Github Secrets üzerinden buraya bağlayacağız
          PYTHONUNBUFFERED: "1"
