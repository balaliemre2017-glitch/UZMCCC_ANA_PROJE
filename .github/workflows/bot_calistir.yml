name: Otomatik Sosyal Medya Botu

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # Elle çalıştır butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f gereksinimler.txt ]; then pip install -r gereksinimler.txt; fi

      - name: Botu Çalıştır
        run: python ana.py

      - name: Hafızayı Kaydet (Meta Unutmasın Diye)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add . || true
          git commit -m "Hafiza guncellendi [auto]" || true
          git push
